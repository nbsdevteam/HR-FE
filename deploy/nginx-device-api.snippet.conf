# Optional nginx location for hr.nooralnibras.com (sites-available/hr).
# Prefer this over Vite preview.proxy when sudo is available on .211:
#
#   sudo cp this snippet into the SSL server block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Until then, Vite preview.proxy on :5177 already serves /device-api.
#
# IMPORTANT (Hikvision employee-number hand-off §5): the target below must be
# the host running PRODUCTION's hr-sync.service (the "capo" box) — the one
# Odoo instance that owns terminal 192.168.15.15 (see the hand-off §0). It
# previously pointed at 192.168.116.204:8089, the development box, where
# nothing listens; that address came from vite.config.ts's dev-only fallback
# and was copied here by mistake. Fill in <PRODUCTION_HR_SYNC_HOST> before
# installing this — do not guess or reuse the development address again.

    # Hikvision device-sync (production hr-sync.service — fill in the host)
    location /device-api/ {
        proxy_pass http://<PRODUCTION_HR_SYNC_HOST>:8089/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
