# Optional nginx location for hr.nooralnibras.com (sites-available/hr).
# Prefer this over Vite preview.proxy when sudo is available on .211:
#
#   sudo cp this snippet into the SSL server block, then:
#   sudo nginx -t && sudo systemctl reload nginx
#
# Until then, Vite preview.proxy on :5177 already serves /device-api.

    # Hikvision device-sync (Iraq host 192.168.116.204:8089)
    location /device-api/ {
        proxy_pass http://192.168.116.204:8089/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
