# Optional nginx location for hr.nooralnibras.com (sites-available/hr).
# Vite preview (:5177) already proxies this one endpoint (preview.proxy in
# vite.config.ts), so this is only needed if that proxy is removed. To apply,
# paste it into the SSL server block, then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Target: the bridge on THIS host (capo runs production's hr-sync.service, the
# one that owns terminal 192.168.15.15), so 127.0.0.1:8089. It once pointed at
# 192.168.116.204:8089, the development box, where nothing listens — do not
# reuse that address.
#
# Only the read-only device overview is exposed, GET only. Do NOT widen this to
# a catch-all `location /device-api/`: the bridge's person, face, event and sync
# reads have no authentication, and its write routes accept any HR login, with
# no check that the caller is HR staff.

    # Hikvision device-sync bridge (same host, :8089)
    location = /device-api/device/info {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8089/api/device/info;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
